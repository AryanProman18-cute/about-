name: Unzip and deploy site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unzip-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip if present
        id: unzip
        run: |
          ZIP=$(find . -maxdepth 2 -name 'about.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
          fi
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -o -q "$ZIP"
            rm -f "$ZIP"
            echo "extracted=true" >> "$GITHUB_OUTPUT"
          else
            echo "No zip found, skipping extraction (plain rebuild + redeploy)."
            echo "extracted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the extracted files
        if: steps.unzip.outputs.extracted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract site files from zip (workflow)" || echo "No changes to commit"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
